name: CI & Skills Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills, Commands, Tests, and Routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate skills
        run: node scripts/validate-skills.js
      - name: Validate commands
        run: node scripts/validate-commands.js
      - name: Validate references
        run: node scripts/validate-reference-links.js
      - name: Validate artifacts
        run: node scripts/validate-artifact-paths.js
      - name: Validate versions
        run: node scripts/validate-versions.js
      - name: Validate public distribution
        run: node scripts/validate-distribution.js
      - name: Run unit tests
        run: node --test scripts/*-test.js
      - name: Run deterministic routing evals
        run: node scripts/run-evals.js --min-rank1 80
  windows-automation:
    name: Validate Windows automation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test junction setup and Gemini reconciliation
        shell: powershell
        run: .\scripts\test-windows-automation.ps1
