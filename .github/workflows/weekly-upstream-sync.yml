name: Weekly Upstream Sync

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Merge upstream into sync branch
        run: |
          git remote add upstream https://github.com/addyosmani/agent-skills.git
          git fetch --no-tags upstream main
          node scripts/merge-upstream.js upstream/main
      - name: Refresh downstream distribution metadata
        run: node scripts/refresh-distribution.js
      - name: Detect distribution changes
        id: sync_diff
        run: |
          if git diff --quiet origin/main --; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Upstream merge leaves the distribution tree unchanged."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run complete quality gates
        run: |
          node scripts/validate-skills.js
          node scripts/validate-commands.js
          node scripts/validate-reference-links.js
          node scripts/validate-artifact-paths.js
          node scripts/validate-versions.js
          node scripts/validate-distribution.js
          node --test scripts/*-test.js
          node scripts/run-evals.js --min-rank1 80
      - name: Open sync pull request
        if: ${{ steps.sync_diff.outputs.has_changes == 'true' }}
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/upstream-sync
          delete-branch: true
          base: main
          title: 'chore: sync upstream agent skills'
          commit-message: 'chore: sync upstream agent skills'
          body: |
            Automated upstream sync. All repository quality gates ran before this PR was opened.
          labels: upstream-sync
